apiVersion: v1
kind: Namespace
metadata:
  name: wtcthegame
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wtcthegame
  namespace: wtcthegame
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wtcthegame
  template:
    metadata:
      labels:
        app: wtcthegame
    spec:
      containers:
        - name: wtcthegame
          image: <IMAGE>
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: wtcthegame
  namespace: wtcthegame
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
  selector:
    app: wtcthegame